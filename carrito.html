<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sugar Rush - Carrito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@500;600&family=Kaushan+Script&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --pink-bar:#ffdce9;
  --pink-soft:#fff3f8;
  --pink:#ff8fb4;
  --pink-btn-a:#ffc3d8;
  --pink-btn-b:#ff8db3;
  --magenta:#ee0a9d;
  --olive:#4f5b25;
  --slate:#5a6466;
  --brown:#4a2012;
  --ink:#111;
  --paper:#fffefb;
  --red:#e8505b;
  --green:#8cc63f;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  padding:20px;
  font-family:'Open Sans',system-ui,sans-serif;
  color:var(--ink);
  background-color:#fff5fa;
  background-image:
    linear-gradient(90deg,rgba(255,150,195,.26) 50%,transparent 50%),
    linear-gradient(rgba(255,150,195,.26) 50%,transparent 50%);
  background-size:44px 44px;
}
button{font:inherit;cursor:pointer}
a{color:inherit}
svg{display:block}

.sheet{max-width:1700px;margin:0 auto;background:var(--paper);min-height:calc(100vh - 40px);position:relative;display:flex;flex-direction:column}
.bar{background:var(--pink-bar);height:110px;display:flex;align-items:center;justify-content:space-between;padding:0 56px;gap:16px;flex:none}
.bar .right{display:flex;align-items:center;gap:26px}
.main{flex:1;padding:0 56px 24px;position:relative}

.link{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;letter-spacing:.12em;text-transform:uppercase;font-size:15px;display:inline-flex;align-items:center;gap:12px}
.link.pink{color:var(--magenta);text-decoration:underline}
.link.plain{text-decoration:none}
.iconbtn{background:none;border:0;padding:0;position:relative;display:inline-flex}
.badge{position:absolute;top:-6px;right:-8px;min-width:18px;height:18px;border-radius:9px;background:#f6c9f7;color:#7a2a79;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.badge.big{min-width:46px;height:46px;border-radius:50%;font-size:26px;top:auto;bottom:-10px;left:-14px;right:auto;background:#f78fb0;color:#fff;border:2px dashed rgba(255,255,255,.7)}

h1.serif,h2.serif{font-family:'Bodoni Moda',Didot,serif;font-weight:500;letter-spacing:.06em;text-transform:uppercase;margin:0;text-align:center}
.script{font-family:'Kaushan Script','Brush Script MT',cursive;color:var(--slate);text-align:center;margin:0;font-weight:400;text-shadow:0 2px 3px rgba(0,0,0,.18)}
.body-serif{font-family:'Times New Roman',Times,serif;letter-spacing:.09em;line-height:1.55;font-size:20px}
.label{letter-spacing:.14em;text-transform:uppercase;font-size:15px}

.btn{border:1px solid rgba(255,255,255,.7);border-radius:999px;background:linear-gradient(#ffc9dc,#ff8db3);color:#4b3b40;font-weight:700;letter-spacing:.16em;text-transform:uppercase;padding:20px 54px;font-size:17px;box-shadow:6px 8px 10px rgba(0,0,0,.28);transition:transform .1s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(1px);box-shadow:3px 4px 6px rgba(0,0,0,.28)}
.btn.sm{padding:14px 36px;font-size:14px}
.btn.red{background:linear-gradient(#ff3a33,#c8232b);color:#fff}
.btn.flat{box-shadow:none;background:#f68bad;color:#fff;font-family:Verdana,sans-serif;letter-spacing:.04em;text-transform:none;font-size:20px;padding:16px 54px;border-color:#f5a6c0}

.field{display:block;width:100%;border:2.5px solid #4a4a4a;border-radius:999px;padding:17px 22px;font:inherit;font-family:Verdana,sans-serif;font-size:19px;background:#fff;color:#333}
.field::placeholder{color:#8a8a8a}
.field:focus{outline:3px solid #ffb6cf}

.social{display:flex;gap:18px;align-items:center}
.foot{display:flex;justify-content:space-between;align-items:flex-end;padding:26px 56px 22px;gap:14px;flex-wrap:wrap}
.foot .help{letter-spacing:.12em;text-transform:uppercase;font-size:15px}
.foot .help button{background:none;border:0;padding:0;color:var(--magenta);letter-spacing:.12em;text-transform:uppercase;font-size:15px}

/* Carrito */
.cart-head{display:flex;align-items:center;justify-content:center;gap:56px;margin:44px 0 26px}
.cart-head .script{font-size:84px;line-height:1}
.lines{display:flex;flex-direction:column;gap:20px;align-items:center}
.line{display:flex;width:100%;max-width:400px;background:var(--pink-bar);align-items:stretch;min-height:80px}
.line .ph{width:112px;flex:none;overflow:hidden}
.line img{width:100%;height:100%;object-fit:cover;display:block}
.line .tx{flex:1;text-align:center;padding:12px 6px 8px;display:flex;flex-direction:column;justify-content:center;position:relative}
.line .nm{font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:14px}
.line .pr{font-weight:700;font-size:23px;letter-spacing:.06em}
.line .x{position:absolute;right:10px;bottom:6px;background:none;border:0;padding:0}
.totalrow{display:flex;align-items:center;justify-content:center;gap:40px;margin:36px 0 10px}
.totalrow .tt{font-weight:700;font-size:28px;letter-spacing:.14em;text-align:center;line-height:1.5}
.cart-empty{text-align:center;color:#7d6a72;letter-spacing:.1em;padding:40px 0}

/* Pago */
.pay-title{font-size:92px;line-height:1.1;margin-top:44px}
.opts{display:flex;flex-direction:column;gap:30px;margin:26px auto 0;max-width:700px}
.opt{display:flex;align-items:center;gap:18px;background:#fff4fa;border-radius:999px;padding:14px 26px 14px 14px;border:4px solid transparent;text-align:left;width:100%;min-height:74px}
.opt.on{border-color:#ee0a9d}
.opt .ic{width:56px;flex:none;display:flex;justify-content:center}
.opt .tx{flex:1;font-family:'Times New Roman',serif;letter-spacing:.1em}
.opt .tx b{display:block;font-weight:400;font-size:24px;color:#111}
.opt .tx span{font-size:18px;color:#666}
.opt .ck{width:36px;height:36px;border-radius:50%;border:1.5px solid #222;display:flex;align-items:center;justify-content:center;flex:none;background:#fff}
.opt.on .ck{background:#ee0a9d;border:3px solid #e60094}
.opt .ck svg{opacity:.3}
.opt.on .ck svg{opacity:1}
.sums{text-align:center;font-family:'Times New Roman',serif;letter-spacing:.1em;font-size:25px;color:#666;line-height:1.35;margin-top:32px}
.sums .tot{color:#111;font-size:25px;margin-top:14px}
.paybtn{display:flex;justify-content:center;margin-top:22px}

/* Modal */
.ov{position:fixed;inset:0;background:rgba(40,10,25,.38);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;animation:fade .15s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border:5px solid #000;max-width:600px;width:100%;padding:34px 36px 26px;position:relative;display:flex;gap:30px;align-items:center;flex-wrap:wrap}
.modal .mx{position:absolute;top:8px;right:12px;background:none;border:0;padding:0}
.modal .tx{flex:1;min-width:220px;text-align:center;letter-spacing:.1em;font-size:15px;line-height:1.55}
.modal .tx .h{font-size:17px;letter-spacing:.14em;text-transform:uppercase;display:block;margin-bottom:6px}
.modal .tx ul{margin:6px 0 0;padding:0;list-style:none}
.modal .tx li:before{content:"•";margin-right:10px}
.modal .tx .small{font-size:14px}
.modal .tx .foot2{display:block;margin-top:16px;font-size:14px}
.modal .tx .foot2 button{background:none;border:0;padding:0;color:var(--magenta);letter-spacing:.1em;font-size:14px}
.modal.col{flex-direction:column;text-align:center}
.confirm-btns{display:flex;align-items:center;gap:26px;margin-top:18px;width:100%;justify-content:center}
.confirm-btns .sep{width:0;height:56px;border-left:4px dotted #000}
.cbtn{border:1px solid rgba(0,0,0,.4);border-radius:999px;padding:9px 16px;font-size:13px;letter-spacing:.06em;color:#222;min-width:130px}
.cbtn.g{background:var(--green)}
.cbtn.r{background:#eb5360;color:#222}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#4a2012;color:#fff;padding:12px 22px;border-radius:999px;letter-spacing:.08em;font-size:14px;opacity:0;pointer-events:none;transition:all .25s;z-index:60}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:900px){
  .bar{padding:0 22px;height:92px}
  .main{padding:0 22px 20px}
  .bar .right{gap:16px}
  .link{font-size:12px;gap:8px}
  .foot{padding:22px}
  .cart-head .script{font-size:60px}
  .pay-title{font-size:60px}
}
@media (max-width:520px){
  .bar{flex-wrap:wrap;height:auto;padding:14px 16px;justify-content:center}
  .link{letter-spacing:.06em}
  .cart-head{gap:30px}
  .totalrow{flex-direction:column;gap:20px}
}
</style>
</head>

  check:(c='#111',s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.500l4.500 4.500L19 7"/></svg>`
};

/* ---------- Carrito compartido con la tienda (localStorage) ---------- */
const CART_KEY = 'sugarrush_carrito';
function readCart(){
  try{ const c = JSON.parse(localStorage.getItem(CART_KEY)); return Array.isArray(c) ? c : []; }
  catch(e){ return []; }
}
function saveCart(c){ try{ localStorage.setItem(CART_KEY, JSON.stringify(c)); }catch(e){} }

const state = { cart: readCart(), pay:'pse' };
const DELIVERY = 5000;
const money = n => '$' + n.toLocaleString('en-US');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const units = () => state.cart.reduce((a,l)=>a+l.qty,0);
const total = () => state.cart.reduce((a,l)=>a+l.price*l.qty,0);
const img = (k,alt='') => PHOTOS[k] ? `<img src="${PHOTOS[k]}" alt="${esc(alt)}">` : '';

/* ---------- Piezas comunes ---------- */
const social = () => `<div class="social">${I.facebook()}${I.instagram()}${I.youtube()}${I.x()}</div>`;
const footer = help => `<div class="foot">${social()}${help?`<div class="help">¿Necesitas ayuda? <button data-go="about">Contáctanos</button></div>`:''}</div>`;
const userBtn = () => `<button class="iconbtn" data-go="login" aria-label="Cuenta">${I.user()}</button>`;
const backLink = (to,text) => `<button class="link" data-go="${to}">${I.back('#5a6466',50)}<span>${text}</span></button>`;
const barBack = (to,text,right='') => `<div class="bar">${backLink(to,text)}<div class="right">${right}</div></div>`;

/* ---------- Vistas ---------- */
const views = {
  cart(){
    return `<div class="sheet">
      ${barBack('store','Volver a la tienda', userBtn())}
      <div class="main">
        <div class="cart-head"><span style="position:relative;display:inline-flex">${I.cart('#000',80)}<span class="badge big">${units()}</span></span><h1 class="script">Carrito</h1></div>
        <div class="lines">
          ${state.cart.length ? state.cart.map((l,i)=>`<div class="line"><div class="ph">${img(l.img,l.name)}</div><div class="tx"><span class="nm">${esc(l.name)} x${l.qty}</span><span class="pr">${money(l.price*l.qty)}</span><button class="x" data-act="ask-del" data-i="${i}" aria-label="Eliminar ${esc(l.name)}">${I.xmark('#e8505b',26)}</button></div></div>`).join('') : `<div class="cart-empty">Tu carrito está vacío.<br><br><button class="link pink plain" data-go="store" style="text-decoration:underline">Ir a la tienda</button></div>`}
        </div>
        <div class="totalrow"><div class="tt">TOTAL<br>${money(total())}</div><button class="btn red" data-act="topay" style="padding:20px 62px">Pagar</button></div>
      </div>
    </div>`;
  },

  pay(){
    const opt = (k,ic,t,s) => `<button class="opt ${state.pay===k?'on':''}" data-act="pay" data-k="${k}" role="radio" aria-checked="${state.pay===k}"><span class="ic">${ic}</span><span class="tx"><b>${t}</b><span>${s}</span></span><span class="ck">${I.check('#111',20)}</span></button>`;
    const sub = total();
    return `<div class="sheet">
      ${barBack('cart','Volver al carrito', userBtn())}
      <div class="main">
        <h1 class="script pay-title">Métodos de pago</h1>
        <div class="opts" role="radiogroup">
          ${opt('tarjeta',I.card(),'Tarjeta débito/crédito','Visa ****38')}
          ${opt('pse',I.bank(),'PSE','Paga desde tu cuenta con tu banco')}
          ${opt('contra',I.cash(),'Contra-entrega','Pago al recibir tu pedido')}
        </div>
        <div class="sums">Subtotal: ${money(sub)}<br>Domicilio: ${money(DELIVERY)}<div class="tot">Total: ${money(sub+DELIVERY)}</div></div>
        <div class="paybtn"><button class="btn" data-act="dopay" style="text-decoration:underline">Pagar</button></div>
      </div>
      ${footer(true)}
    </div>`;
  }
};

/* ---------- Ventanas emergentes ---------- */
function modal(html, cls=''){
  state.afterOk = null;
  document.getElementById('modal-root').innerHTML = `<div class="ov" data-act="ov"><div class="modal ${cls}" role="dialog" aria-modal="true">${html}</div></div>`;
}
const clearModal = () => { document.getElementById('modal-root').innerHTML=''; };
const closeModal = () => {
  clearModal();
  if(state.afterOk){ const to = state.afterOk; state.afterOk = null; go(to); }
};
const xbtn = () => `<button class="mx" data-act="close" aria-label="Cerrar">${I.xmark('#e8505b',24)}</button>`;
function errorModal(title, body){ modal(`${xbtn()}${I.err()}<div class="tx"><span class="h">${title}</span>${body}</div>`); }
function okModal(title, body, to){ modal(`${xbtn()}${I.ok()}<div class="tx"><span class="h">${title}</span>${body}</div>`); state.afterOk = to; }

let toastT;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1800); }

/* ---------- Router ---------- */
/* Pantallas de este archivo: #/cart y #/pay. El resto vive en otras páginas del sitio. */
const EXTERNAL = { home:'index.html', store:'tienda.html', login:'login.html', about:'index.html#sobre-nosotros' };
function route(keepScroll){
  state.cart = readCart();
  const h = (location.hash || '#/cart').replace(/^#\//,'');
  const view = views[h] || views.cart;
  clearModal();
  document.getElementById('app').innerHTML = view();
  if(keepScroll!==true) window.scrollTo(0,0);
  document.title = h==='pay' ? 'Sugar Rush - Métodos de pago' : 'Sugar Rush - Carrito';
}
const go = to => {
  if(EXTERNAL[to]){ location.href = EXTERNAL[to]; return; }
  if(location.hash === '#/'+to) route(); else location.hash = '#/'+to;
};
window.addEventListener('hashchange', () => route());
window.addEventListener('pageshow', e => { if(e.persisted) route(true); });

/* ---------- Eventos ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-go],[data-act]');
  if(!el) return;
  if(el.dataset.go){ go(el.dataset.go); return; }
  const a = el.dataset.act;
  if(a==='ov'){ if(e.target===el) closeModal(); return; }
  if(a==='close'){ closeModal(); return; }
  if(a==='ask-del'){
    const i = +el.dataset.i;
    modal(`<div class="tx" style="width:100%"><span style="letter-spacing:.1em;font-size:16px;line-height:1.6;display:block">¿Está seguro de eliminar este producto<br>del carrito?</span></div><div class="confirm-btns"><button class="cbtn g" data-act="del" data-i="${i}">Sí, estoy seguro</button><span class="sep"></span><button class="cbtn r" data-act="close">No, no estoy seguro</button></div>`,'col');
    return;
  }
  if(a==='del'){ state.cart.splice(+el.dataset.i,1); saveCart(state.cart); route(true); return; }
  if(a==='topay'){
    if(!state.cart.length){ toast('Tu carrito está vacío'); return; }
    go('pay'); return;
  }
  if(a==='pay'){ state.pay = el.dataset.k; route(true); return; }
  if(a==='dopay'){
    if(state.pay==='tarjeta'){
      errorModal('La tarjeta ingresada ha sido rechazada/transacción declinada',
        `<span class="small" style="display:block">Por favor contáctese con su banco pertinente<br>o corrobore la informacion ingresada en cada campo<br>Inténtelo de nuevo.</span><span class="foot2">¿Volvió a salir este error? <button data-act="reload">por favor reinicie la página</button></span>`);
    } else {
      const pagado = total() + DELIVERY;
      okModal('¡Pedido confirmado!', `<span class="small" style="display:block">Total pagado: ${money(pagado)}<br>${state.pay==='pse'?'Pago por PSE':'Pago contra-entrega'}</span>`, 'home');
      state.cart = []; saveCart(state.cart);
    }
    return;
  }
  if(a==='reload'){ location.reload(); return; }
});
document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });

route();
</script>
</body>
</html>
